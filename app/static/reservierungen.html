<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservierungen</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129302;</text></svg>">
</head>
<body>
<header>
  <div class="wrap">
    <nav class="navi" id="navi"></nav>
    <h1>Reservierungen</h1>
    <p class="lead">
      Slots für ein Zeitfenster sichern. Während einer Reservierung dürfen
      andere nur die übrigen Slots belegen.
    </p>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="knopfleiste">
      <button id="btn-zurueck">◀ Vortag</button>
      <input type="date" id="f-tag">
      <button id="btn-vor">Folgetag ▶</button>
      <button id="btn-heute">Heute</button>
      <span id="tag-status" class="status"></span>
    </div>
    <div id="belegung">Lade …</div>
  </section>

    <section>
      <h2>Slots reservieren <a class="erklaerung" href="/anleitung#reservierungen">Regeln nachlesen</a></h2>
      <form id="reservieren-formular" class="regler" autocomplete="off">
        <label for="f-modell">Modell</label>
        <select id="f-modell"></select>
        <label for="f-datum">Datum</label>
        <input type="date" id="f-datum" required>
        <label for="f-von">Von</label>
        <select id="f-von" required></select>
        <label for="f-bis">Bis</label>
        <select id="f-bis" required></select>
        <label for="f-slots">Slots</label>
        <input type="number" id="f-slots" min="1" value="1" required>
        <label for="f-notiz">Notiz (freiwillig)</label>
        <input type="text" id="f-notiz" maxlength="200" placeholder="wofür?">
        <div class="knopfleiste">
          <button type="submit" class="primaer">Reservieren</button>
          <span id="reservieren-meldung" class="status"></span>
        </div>
      </form>
      <p class="hinweis" id="regeln"></p>
    </section>

    <section>
      <h2>Meine Reservierungen</h2>
      <div id="eigene-liste"></div>
    </section>
</main>

<footer class="wrap">
  <p>Version <span id="fuss-version">…</span></p>
</footer>

<script src="/gemeinsam.js"></script>
<script src="/reservierungen.js"></script>
</body>
</html>
