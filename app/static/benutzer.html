<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benutzer</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129302;</text></svg>">
</head>
<body>
<header>
  <div class="wrap">
    <nav class="navi" id="navi"></nav>
    <h1>Benutzer</h1>
    <p class="lead">Konten anlegen und verwalten. Nur Administratoren dürfen Einstellungen ändern und Konten anlegen.</p>
  </div>
</header>

<main class="wrap">

  <section id="kein-zugriff" hidden>
    <h2>Keine Berechtigung</h2>
    <p class="hinweis">
      Die Benutzerverwaltung ist Administratoren vorbehalten. Deinen eigenen
      Zugangsschlüssel findest du unter <a href="/konto">Konto</a>.
    </p>
  </section>

    <section>
      <h2>Konten</h2>
      <div id="benutzer-liste">Lade …</div>
    </section>

    <section>
      <h2>Konto anlegen</h2>
      <form id="anlegen-formular" class="regler" autocomplete="off">
        <label for="f-neuer-name">Benutzername</label>
        <input type="text" id="f-neuer-name" autocomplete="off" spellcheck="false" required>
        <label for="f-neues-passwort">Passwort</label>
        <input type="password" id="f-neues-passwort" autocomplete="new-password" required>
        <label for="f-rolle">Rolle</label>
        <select id="f-rolle">
          <option value="nutzer" selected>nutzer – darf reservieren</option>
          <option value="admin">admin – darf zusätzlich alles ändern</option>
        </select>
        <div class="knopfleiste">
          <button type="submit" class="primaer">Anlegen</button>
          <span id="anlegen-meldung" class="status"></span>
        </div>
      </form>
      <div id="neuer-token"></div>
    </section>
  </div>

</main>

<footer class="wrap">
  <p>Version <span id="fuss-version">…</span></p>
</footer>

<script src="/gemeinsam.js"></script>
<script src="/benutzer.js"></script>
</body>
</html>
