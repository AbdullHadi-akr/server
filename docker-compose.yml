services:
  portal:
    build: .
    image: modell-portal:latest
    container_name: modell-portal
    restart: unless-stopped
    ports:
      # Portal UND Modell-Anfragen: Was keine Portal-Route ist, reicht das
      # Portal an Ollama weiter. Nur dieser eine Port muss offen sein.
      - "5021:5021"
    environment:
      # Zeitzone des Containers. Die Oberflaeche rechnet Zeiten ohnehin im
      # Browser, aber Protokoll und serverseitige Meldungen (etwa "reserviert
      # bis 15:00") folgen dieser Angabe. Der Ollama-Container sollte dieselbe
      # Zone haben, weil die Auslastungsanalyse dessen Zugriffslog liest.
      TZ: "Europe/Berlin"

      # Adresse, unter der DAS PORTAL Ollama erreicht: Funktionspruefung,
      # Modelltests, Status und Auslastung laufen darueber.
      OLLAMA_URL: "http://AZEU-DEW-DEVGPU-02:5020"
      # Adresse, die den NUTZERN in der VS-Code-Konfiguration gezeigt wird.
      # Sie zeigt auf das Portal selbst, damit die Anfragen durch das Portal
      # laufen und je Modell gezaehlt werden koennen.
      PUBLIC_OLLAMA_URL: "http://azeu-dew-devappl-01:5021"
      # Die vorherige Adresse - nur fuer den Umstellungshinweis auf der Seite.
      ALT_OLLAMA_URL: "http://azeu-dew-devappl-01:5020"
      VENDOR_NAME: "A100"

      # Name des Containers, in dem Ollama laeuft (fuer die Betriebsseite).
      OLLAMA_CONTAINER: "ollama"
      # Auf "false" setzen, um die Einstellungsseite auf Nur-Lesen zu beschraenken.
      DOCKER_STEUERUNG: "true"
      # Das Passwort der Einstellungsseite wird beim ersten Aufruf im Browser
      # gesetzt und als Hash unter /data abgelegt. Alternativ laesst es sich
      # hier fest vorgeben - dann entfaellt die Ersteinrichtung:
      # PORTAL_PASSWORT: "bitte-aendern"
      # Gueltigkeit einer Anmeldung in Sekunden (Standard 8 Stunden).
      SITZUNGSDAUER: "28800"

      # Muessen Chat-Anfragen einen Zugangsschluessel mitbringen? Erst auf
      # "true" schalten, wenn die Uebersicht zeigt, dass niemand mehr ohne
      # Schluessel anfragt - sonst bricht der Chat der Betroffenen ab.
      TOKEN_PFLICHT: "false"

      # Proxy-Modus. Auf "false" setzen, wenn das Portal nicht im Weg des
      # Chat-Verkehrs stehen soll - dann tragen die Nutzer wieder den direkten
      # Ollama-Port ein.
      PROXY_AKTIV: "true"
      # Ohne Angabe laeuft der Proxy am Portal-Port. Ein abweichender Wert
      # startet einen zweiten Listener und braucht einen weiteren Port.
      # PROXY_PORT: "5022"

      # Reservierungen: laengstes Zeitfenster und wie viele Slots normalen
      # Nutzern verwehrt bleiben, damit einer nicht alle aussperrt.
      RESERVIERUNG_MAX_STUNDEN: "4"
      RESERVIERUNG_MIN_FREI: "1"

      # Verlaufsaufzeichnung.
      VERLAUF_AKTIV: "true"
      VERLAUF_TAKT: "60"
      VERLAUF_TAGE: "30"

      # GPU-Ausstattung fuer den VRAM-Rechner.
      GPU_NAME: "NVIDIA A100"
      GPU_VRAM_GIB: "80"
      # Aktuell im Ollama-Container gesetzte Werte.
      STANDARD_PARALLEL: "4"
      STANDARD_KONTEXT: "50000"
    volumes:
      # Noetig fuer Status, Neustart und das Uebernehmen von Einstellungen.
      # Nur-Lesen genuegt nicht - Neustarts sind schreibende Aufrufe.
      - /var/run/docker.sock:/var/run/docker.sock
      # Haelt den Passwort-Hash ueber Neustarts hinweg.
      - portal-daten:/data
    # GID der Gruppe "docker" auf dem Host; ermittelbar mit
    # 'getent group docker'. Ohne passende GID verweigert der Socket den Zugriff.
    group_add:
      - "115"
    # Noetig, wenn Ollama auf dem Docker-Host selbst laeuft und ueber
    # host.docker.internal erreicht werden soll.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  portal-daten:
